services:
  db:
    image: postgres:17
    container_name: activogo-db
    environment:
      POSTGRES_USER: activogo
      POSTGRES_PASSWORD: activogo
      POSTGRES_DB: activogo
    ports:
      - "5432:5432"
    volumes:
      - activogo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activogo -d activogo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  activogo-pgdata:
