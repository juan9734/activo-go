name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api:
    name: API (compilación y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      # Solo para que `prisma generate` lea la configuración; las pruebas unitarias no abren conexión.
      DATABASE_URL: postgresql://activogo:activogo@localhost:5432/activogo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test

  mobile:
    name: Mobile (lint, pruebas, build y presupuesto)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
      - run: npm run presupuesto
